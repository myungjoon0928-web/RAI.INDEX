name: Update RAI & NPS data

on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC = 06:00 KST (next day), after US market close
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy openpyxl

      - name: Run RAI update
        run: python update_rai.py

      - name: Run NPS update
        run: python update_nps.py

      - name: Run backtest
        run: python backtest_rai.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rai_dashboard_data_weekly.json rai_dashboard_data_daily.json \
                  rai_asset_prices_weekly.json rai_asset_prices_daily.json \
                  nps_dashboard_data_weekly.json nps_dashboard_data_daily.json \
                  backtest_results.json
          git diff --cached --quiet || git commit -m "Auto-update RAI/NPS/backtest data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
