name: Update RAI v2

on:
  workflow_dispatch:

  schedule:
    # Every weekday at 23:30 UTC = 08:30 KST
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

jobs:
  update-rai-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build RAI v2 market data
        run: |
          python build_rai_v2.py

      - name: Commit updated RAI v2 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rai_v2_market_daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update RAI v2 market data"
            git push
          fi
